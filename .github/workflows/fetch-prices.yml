name: Sanaddak Gold Prices Tracker

on:
  schedule:
    # Cairo is UTC+2 (no DST)
    - cron: "0 7 * * *"   # 09:00 Cairo
    - cron: "0 10 * * *"  # 12:00 Cairo
    - cron: "0 13 * * *"  # 15:00 Cairo
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check secret is set
        run: |
          if [ -z "$SCRAPER_API_KEY" ]; then
            echo "ERROR: SCRAPER_API_KEY is empty or not set"
            exit 1
          else
            echo "SCRAPER_API_KEY is set (length: ${#SCRAPER_API_KEY})"
          fi
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - name: Run price sweeper
        run: python price_sweeper.py
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "prices: $(date -u '+%Y-%m-%d')"
          git push
